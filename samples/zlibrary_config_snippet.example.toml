# Z-Library authorized academic integration example.
# First log in to https://z-library.im/ in your browser, then export the login
# cookies to the Netscape-format file configured below. Keep this file private.
#
# By default this source is disabled and does not participate in automatic
# library building. To opt in, set both blocks to enabled = true and set
# daily_auto_download_limit to the number of academic books allowed per day.

[[ranking_sources]]
name = "zlibrary_im_academic_daily"
type = "zlibrary_web"
enabled = false
authorized = true
license_note = "User confirms https://z-library.im/ is an authorized academic source for their logged-in account"
base_url = "https://z-library.im/"
cookie_file = "secrets/zlibrary.cookies.txt"
rank_type = "Z-Library authorized academic catalog"
search_queries = ["高等数学"]
daily_auto_download_limit = 0
default_genre = "学术-综合"
trust_completed = true
academic_only = true
exact_title = true
max_results = 10
result_link_selector = "a[href*='/book/']"
download_link_selector = "a[href*='/dl/'], a[href*='/download/'], a[href*='download']"

[[download_sources]]
name = "zlibrary_im"
type = "zlibrary_web_search"
enabled = false
authorized = true
license_note = "User confirms https://z-library.im/ is authorized and requires a logged-in cookie"
base_url = "https://z-library.im/"
cookie_file = "secrets/zlibrary.cookies.txt"
default_genre = "学术-综合"
trust_completed = true
academic_only = true
exact_title = true
max_results = 10
result_link_selector = "a[href*='/book/']"
download_link_selector = "a[href*='/dl/'], a[href*='/download/'], a[href*='download']"
