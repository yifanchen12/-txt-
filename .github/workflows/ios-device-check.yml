name: Check iOS local device workflow

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-device-check.yml'

permissions:
  contents: read

jobs:
  unsigned-build-and-tests:
    runs-on: macos-15-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm test
      - run: npm run build
      - run: npx cap add ios
      - run: npx cap sync ios
      - name: Verify repeated native configuration
        run: |
          node scripts/prepare-native.mjs
          shasum ios/App/App/Info.plist > /tmp/shiye-plist-before.txt
          node scripts/prepare-native.mjs
          shasum ios/App/App/Info.plist > /tmp/shiye-plist-after.txt
          diff -u /tmp/shiye-plist-before.txt /tmp/shiye-plist-after.txt
      - name: Compile unsigned device target (not a signing or phone-install check)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath ios-build CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
