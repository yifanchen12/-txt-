name: Build mobile apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-release.yml'

permissions:
  contents: write

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct-sources:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --registry=https://registry.npmjs.org
      - name: Search and retrieve sample chapters without proxy software
        run: node scripts/check-direct-sources.mjs
      - name: Verify recommendation bodies before exposing books
        run: node scripts/check-verified-feed.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-source-report
          path: |
            mobile/.reports/direct-sources.json
            mobile/.reports/discovery.json
            mobile/.reports/verified-feed.json

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm test
      - run: npm run build
      - run: npx cap add android
      - run: node scripts/prepare-native.mjs
      - name: Compile APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Package Android and website
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/shiye-android.apk
          cd dist
          zip -qr ../release/shiye-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: android-and-web
          path: mobile/release/*

  ios:
    runs-on: macos-15-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm test
      - run: npm run build
      - run: npx cap add ios
      - run: node scripts/prepare-native.mjs
      - name: Compile real iPhone device application without signing
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath ios-build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
      - name: Package unsigned IPA
        run: |
          test -f ios-build/Build/Products/Release-iphoneos/App.app/App
          file ios-build/Build/Products/Release-iphoneos/App.app/App
          mkdir -p release/Payload
          cp -R ios-build/Build/Products/Release-iphoneos/App.app release/Payload/
          cd release
          zip -qry shiye-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: mobile/release/shiye-ios-unsigned.ipa

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm test
      - run: npm run package:windows
      - name: Verify independent Windows executable
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'desktop-out/拾页-win32-x64/拾页.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Windows startup or direct connection check failed' }
          Get-Content -LiteralPath "$env:APPDATA/ShiyeReader/verification.json"
      - name: Zip complete portable program
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Compress-Archive -Path 'desktop-out/拾页-win32-x64' -DestinationPath 'release/shiye-windows-x64.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: mobile/release/shiye-windows-x64.zip

  release:
    needs: [android, ios, windows, direct-sources]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish browser-downloadable assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum shiye-android.apk shiye-ios-unsigned.ipa shiye-windows-x64.zip shiye-web.zip > SHA256SUMS.txt
          cat > RELEASE_NOTES.md <<'NOTES'
          拾页：新版书城界面、趣味加载动画与先检验再推荐。

          - Windows：全部解压 shiye-windows-x64.zip，双击 拾页.exe；无需另装运行环境。
          - Android：安装 shiye-android.apk。更新预览版前先备份书库，签名不同可能需要重装。
          - iPhone / iPad：shiye-ios-unsigned.ipa 为未签名包，需自行签名安装。
          - 三种翻页：仿真纸张卷曲、左右整页滑动、上下连续滚动；切换后保留阅读位置。
          - 推荐向下自动追加，新增男女频和常见题材分类，缺失封面显示书名书封。
          - 首页书目先读取目录、实测首中末章；失败不推荐，下载前再次复查。
          - 查源、下载、搜索、加载新书和打开阅读器使用统一旋转变形动画，显示真实进度。
          - Windows 程序、窗口与手机应用使用统一拾页书本图标。
          - 支持 TXT 导入导出、背景、字号、行距、进度恢复和书库备份。
          - 原生应用直接连接书源，运行不依赖电脑服务或代理软件。
          - 网页构建 shiye-web.zip 的联网检索需要配套网页服务。

          使用说明：https://github.com/yifanchen12/shiye#readme
          NOTES
          gh release create "shiye-v1.0.0-${{ github.run_number }}" shiye-android.apk shiye-ios-unsigned.ipa shiye-windows-x64.zip shiye-web.zip SHA256SUMS.txt --title '拾页 · 新版书城与正文核验' --notes-file RELEASE_NOTES.md --latest
